<div class="yg-gate" id="ygTelefon" hidden>
    <div class="yg-gate-card yg-telefon-kart" role="dialog" aria-modal="true" aria-labelledby="ygTelefonBaslik">
      <button class="yg-gate-x" type="button" data-telefon="kapat" aria-label="Kapat"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      <div class="yg-gate-ico"><i id="ygTelefonIkon" class="fa-solid" aria-hidden="true"></i></div>
      <h2 id="ygTelefonBaslik"></h2>
      <p class="yg-telefon-etiket"><span class="ornek-etiket">prototip örneği</span></p>
      <p id="ygTelefonMetin"></p>
      <p class="yg-telefon-rota" id="ygTelefonRota"></p>
      <div class="yg-telefon-bag" id="ygTelefonBag">
        <div class="yg-telefon-qr" id="ygTelefonQr" role="img"></div>
        <b class="yg-telefon-kisa" id="ygTelefonKisa"></b>
        <small class="yg-telefon-not" id="ygTelefonNot"></small>
      </div>
      <div class="yg-gate-acts">
        <button class="yg-gate-primary" type="button" id="ygTelefonBirincil"></button>
        <button class="yg-gate-ghost" type="button" id="ygTelefonIkincil" data-telefon="kapat"></button>
      </div>
    </div>
  </div>
